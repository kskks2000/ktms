<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b5663"/>
      <stop offset="0.46" stop-color="#169396"/>
      <stop offset="1" stop-color="#21c4bd"/>
    </linearGradient>
    <linearGradient id="cyanRoad" x1="140" y1="720" x2="830" y2="230" gradientUnits="userSpaceOnUse">
